name: Build Android Tablet APK

on:
  push:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scanner/cloud-feed.jsonl'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK Platform 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies, test, build web app & sync Capacitor
        run: |
          npm ci
          npm run lint
          npm run build
          npx cap sync android

      - name: Compile signed installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KonkLancer-Studio.apk
          ls -lh ../KonkLancer-Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KonkLancer-Studio-APK
          path: KonkLancer-Studio.apk
          retention-days: 90

      - name: Publish / Update Latest Android APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest KonkLancer-Studio.apk --clobber
          else
            gh release create android-latest KonkLancer-Studio.apk \
              --title "KonkLancer Studio — نسخه بومی تبلت اندروید (APK)" \
              --notes "نسخه مستقل بومی اندروید (مجهز به CapacitorHttp بدون محدودیت CORS، اسکن مستقیم پونیشا/کارلنسر/پارس‌کدرز/تلگرام روی تبلت و اتصال مستقیم به Gemini / Groq / OpenRouter)."
          fi

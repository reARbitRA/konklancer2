name: Build Android Tablet APK

on:
  push:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scanner/cloud-feed.jsonl'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK Platform 34 (compatible with compileSdk 34 / minSdk 24)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies, lint, build web bundle & sync Capacitor
        run: |
          npm ci
          npm run lint
          npm run build
          npx cap sync android

      - name: Compile signed production Release APK (v1 + v2/v3 signed, shrunk, non-debuggable)
        id: gradle_build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ ! -f app/konklancer-release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/konklancer-release.jks \
              -storepass konklancer2026 \
              -keypass konklancer2026 \
              -alias konklancer \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KonkLancer Studio, OU=Mobile, O=Konkred, L=London, ST=England, C=GB"
          fi
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          cp app/build/outputs/apk/release/app-release.apk ../KonkLancer-Studio.apk
          ls -lh ../KonkLancer-Studio.apk

      - name: Report Gradle diagnostic tail on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f gradle-build.log ]; then
            BODY=$(tail -n 90 gradle-build.log)
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="\`\`\`text
          ${BODY}
          \`\`\`" || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KonkLancer-Studio-APK
          path: KonkLancer-Studio.apk
          retention-days: 90

      - name: Publish / Update Latest Android APK Release & Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest KonkLancer-Studio.apk --clobber
          else
            gh release create android-latest KonkLancer-Studio.apk \
              --title "KonkLancer Studio — نسخه بومی تبلت اندروید (APK)" \
              --notes "نسخه مستقل بومی اندروید (مجهز به CapacitorHttp بدون محدودیت CORS، اسکن مستقیم پونیشا/کارلنسر/پارس‌کدرز/تلگرام روی تبلت و اتصال مستقیم به Gemini / Groq / OpenRouter)."
          fi

          # Also publish lightweight orphan git tag apk-latest for direct git fetch delivery
          TMP_APK_DIR=$(mktemp -d)
          cp KonkLancer-Studio.apk "$TMP_APK_DIR/KonkLancer-Studio.apk"
          git -C "$TMP_APK_DIR" init -b apk-latest
          git -C "$TMP_APK_DIR" config user.name "github-actions[bot]"
          git -C "$TMP_APK_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TMP_APK_DIR" add KonkLancer-Studio.apk
          git -C "$TMP_APK_DIR" commit -m "chore(apk): built KonkLancer-Studio.apk from ${{ github.sha }}"
          git -C "$TMP_APK_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C "$TMP_APK_DIR" push -f origin apk-latest:refs/tags/apk-latest

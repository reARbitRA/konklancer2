name: scanner-feed

# اسکن واقعی سایت‌های فریلنسری روی رانرهای گیت‌هاب.
#
# چرا اینجا؟ محیط توسعه/مرورگر به پارس‌کدرز، پونیشا، کارلنسر و t.me دسترسی TCP ندارد
# (HTTP 000 در سطح شبکه). رانر گیت‌هاب اینترنت آزاد دارد، پس همان اسکنر واقعی مخزن
# اینجا اجرا می‌شود: robots.txt رعایت می‌شود، ۸ ثانیه بین درخواست‌ها فاصله می‌گذارد و
# ساختار صفحه در همان لحظه از خود DOM کشف می‌شود (هیچ انتخابگر هاردکدی).
#
# تریگر: تغییر scanner/scan-request.json (چون workflow_dispatch فقط از برنچ پیش‌فرض کار می‌کند).
# خروجی: scanner/cloud-feed.jsonl (فید تجمیعی) + scanner/cloud-status.json (وضعیت و عیب‌یابی)
# روی همین برنچ کامیت می‌شود تا سرور محلی بتواند آن را بخواند، و ضمناً artifact هم می‌شود.

on:
  push:
    paths:
      - 'scanner/scan-request.json'
  schedule:
    - cron: '23 */3 * * *'   # فقط وقتی این فایل روی برنچ پیش‌فرض باشد فعال می‌شود
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-feed

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      KONKLANCER_HTTP_TIMEOUT: '45'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب پیش‌نیازهای اسکنر
        run: python -m pip install --quiet --upgrade pip httpx beautifulsoup4 pytest

      - name: خواندن پارامترها + هارت‌بیت (تأیید اینکه کامیت خودکار کار می‌کند)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os
          defaults = {"platforms": "parscoders,ponisha,karlancer", "pages": 1, "delay": 8, "telegram": 1}
          data = dict(defaults)
          req = pathlib.Path('scanner/scan-request.json')
          if req.exists():
              try:
                  data.update({k: v for k, v in json.loads(req.read_text(encoding='utf-8')).items()
                               if k in defaults and v not in (None, '')})
              except Exception as exc:  # noqa: BLE001
                  print(f"scan-request.json ناخوانا: {exc}")
          status = {
              "phase": "started",
              "run_url": os.environ.get("RUN_URL", ""),
              "started_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "request": data,
              "projects_in_feed": 0,
              "note": "اسکن واقعی روی رانر گیت‌هاب؛ این فایل خودش نشان می‌دهد اجرا شروع شده است.",
          }
          pathlib.Path('scanner/cloud-status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write("platforms=" + str(data['platforms']) + "\n")
              fh.write("pages=" + str(int(data['pages'])) + "\n")
              fh.write("delay=" + str(float(data['delay'])) + "\n")
              fh.write("telegram=" + str(int(data['telegram'])) + "\n")
          print("پارامترها:", data)
          PY
          git config user.name "konklancer-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scanner/cloud-status.json
          git commit -q -m "data(scan): شروع اجرای اسکن [skip ci]" || true
          git push || echo "PUSH_FAILED_START"
        id: params

      - name: تست‌های آفلاین اسکنر
        run: python -m pytest -q scanner/tests

      - name: عیب‌یابی ارتباط (robots.txt و کد پاسخ هر میزبان)
        run: |
          mkdir -p scanner/out
          : > scanner/out/diagnostics.txt
          for host in parscoders.com ponisha.ir www.karlancer.com t.me; do
            {
              echo "=== $host ==="
              echo -n "robots.txt -> "
              curl -s -o /tmp/robots.txt -w '%{http_code}\n' --max-time 20 "https://$host/robots.txt" || echo "curl-failed"
              echo -n "صفحه اصلی -> "
              curl -s -o /tmp/home.html -w '%{http_code} (%{size_download} bytes)\n' --max-time 25 "https://$host/" || echo "curl-failed"
              echo "robots (۳۰۰ کاراکتر اول):"
              head -c 300 /tmp/robots.txt 2>/dev/null || true
              echo
              echo "سربرگ‌ها:"
              curl -s -o /dev/null -D - --max-time 20 "https://$host/" 2>/dev/null | grep -iE '^(HTTP/|server:|content-type:|cf-|x-)' | head -8 || true
              echo
            } >> scanner/out/diagnostics.txt 2>&1
          done
          cat scanner/out/diagnostics.txt

      - name: اسکن واقعی صفحات زنده (کشف خودکار ساختار)
        run: |
          mkdir -p scanner/out
          touch scanner/out/projects.jsonl
          scan_platforms() {
            python -m scanner.konklancer_scan autoscan \
              --platform "${{ steps.params.outputs.platforms }}" \
              --pages "${{ steps.params.outputs.pages }}" \
              --delay "${{ steps.params.outputs.delay }}" \
              --min-count 3 \
              --out scanner/out/projects.jsonl 2>&1 | tee -a scanner/out/diagnostics.txt
          }
          scan_platforms
          # سایت‌های ایرانی از IP ابری گاهی ۴۰۴/۵۰۳/تایم‌اوت می‌دهند؛ یک‌بار دیگر با فاصله امتحان می‌کنیم.
          if [ "$(grep -c . scanner/out/projects.jsonl || true)" -eq 0 ]; then
            echo "=== تلاش دوم پس از ۴۵ ثانیه (خروجی اول خالی بود) ===" | tee -a scanner/out/diagnostics.txt
            sleep 45
            scan_platforms
          fi
          echo "=== جمع‌بندی صفحه‌ها ===" | tee -a scanner/out/diagnostics.txt
          grep -c . scanner/out/projects.jsonl | tee -a scanner/out/diagnostics.txt || true

      - name: اسکن کانال‌های عمومی تلگرام (کانال‌های تأییدشده‌ی مخزن)
        if: ${{ steps.params.outputs.telegram == '1' }}
        run: |
          python - <<'PY' | tee -a scanner/out/diagnostics.txt
          import json, pathlib
          data = json.loads(pathlib.Path('scanner/telegram_sources.json').read_text(encoding='utf-8'))
          enabled = [c['username'] for c in data['channels'] if c.get('scan_enabled')]
          print('کانال‌های فعال برای اسکن:', enabled)
          if not enabled:
              raise SystemExit('هیچ کانالی فعال نیست؛ در telegram_sources.json مشخص کنید.')
          PY
          python -m scanner.konklancer_scan scan --telegram \
            --delay "${{ steps.params.outputs.delay }}" \
            --out scanner/out/projects.jsonl 2>&1 | tee -a scanner/out/diagnostics.txt

      - name: ذخیره‌ی نمونه‌ی HTML واقعی در پوشه‌ی موقت artifact
        continue-on-error: true
        run: |
          python -m scanner.konklancer_scan capture \
            --target parscoders,ponisha,karlancer,https://parscoders.com/project/only-available \
            --telegram \
            --delay "${{ steps.params.outputs.delay }}" \
            --out-dir scanner/out/live-captures 2>&1 | tee -a scanner/out/diagnostics.txt
          ls -la scanner/out/live-captures || true

      - name: انتشار فید و گزارش وضعیت روی برنچ
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p scanner/out
          touch scanner/out/projects.jsonl scanner/out/diagnostics.txt
          python - <<'PY'
          import collections, datetime, json, os, pathlib

          feed = pathlib.Path('scanner/out/projects.jsonl')
          rows = []
          for line in feed.read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if line:
                  try:
                      rows.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass

          diagnostics = pathlib.Path('scanner/out/diagnostics.txt').read_text(encoding='utf-8')
          status = {
              "phase": "finished",
              "job_status": os.environ.get("JOB_STATUS", ""),
              "run_url": os.environ.get("RUN_URL", ""),
              "finished_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "projects_this_run": len(rows),
              "by_category": dict(collections.Counter(r.get("category", "other") for r in rows)),
              "by_source": dict(collections.Counter(r.get("source", "?") for r in rows)),
              "diagnostics": diagnostics[-6000:],
              "note": "فید واقعی از اجرای اسکنر روی رانر گیت‌هاب؛ هیچ داده‌ی ساختگی در آن نیست.",
          }
          pathlib.Path('scanner/cloud-status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')

          # قواعد پاکسازی: ردیف منو/فوتر و کانال‌های غیرفعال نباید در فید بمانند
          cloud = pathlib.Path('scanner/cloud-feed.jsonl')
          seen = {}
          if cloud.exists():
              for line in cloud.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  seen[row.get("id")] = row
          for row in rows:
              seen[row.get("id")] = row

          now_utc = datetime.datetime.now(datetime.timezone.utc)
          fresh_rows = []
          for r in seen.values():
              bids_txt = str(r.get("bids_text") or "")
              posted_txt = str(r.get("posted_text") or "")
              # حذف آگهی‌های سنجاق‌شده‌ی چندماهه/یکساله پارس‌کدرز
              if any(tag in (bids_txt + " " + posted_txt) for tag in ("سال پیش", "ماه پیش")):
                  continue
              scraped_str = str(r.get("scraped_at") or "")
              if scraped_str:
                  try:
                      dt = datetime.datetime.fromisoformat(scraped_str.replace("Z", "+00:00"))
                      if (now_utc - dt).total_seconds() > 7 * 86400:
                          continue
                  except ValueError:
                      pass
              fresh_rows.append(r)

          merged = sorted(fresh_rows, key=lambda r: r.get("scraped_at") or "")
          # سقف نگه‌داری: آخرین ۱۵۰۰ رکورد تا فایل از سقف خواندن contents API (۱ مگابایت) رد نشود
          merged = merged[-1500:]
          cloud.write_text("".join(json.dumps(r, ensure_ascii=False) + "\n" for r in merged), encoding='utf-8')
          print(f"fid ebraei ghabl az pak-sazi: {len(merged)} record")
          PY

          # پاک‌سازی با همان قواعد خود اسکنر (ناوبری، الگوی مسیر پروژه، کانال غیرفعال، تکراری)
          python -m scanner.konklancer_scan prune --file scanner/cloud-feed.jsonl --apply | tee -a scanner/out/diagnostics.txt
          python - <<'PY'
          import pathlib, json, datetime, httpx
          lines = [line for line in pathlib.Path('scanner/cloud-feed.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          print(f"fid ebraei pas az pak-sazi: {len(lines)} record")
          rows = []
          for l in lines[-250:]:
              try:
                  obj = json.loads(l)
                  if str(obj.get("posted_text", "")).startswith(("2020-", "2021-", "2022-", "2023-", "2024-", "2025-")):
                      continue
                  rows.append({"id": obj["id"], "payload": obj, "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat()})
              except Exception:
                  pass
          if rows:
              jwt = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3dXl1aGpraXRjbmVrcHdtb21sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTgwMzYsImV4cCI6MjEwNzkzNDAzNn0.KnWmpopGmuhdeQ5x6sOUfa7pBqeqN57oJhzBSlkuzzs"
              r = httpx.post(
                  "https://rwuyuhjkitcnekpwmoml.supabase.co/rest/v1/konklancer_projects?on_conflict=id",
                  headers={"apikey": jwt, "Authorization": f"Bearer {jwt}", "Prefer": "resolution=merge-duplicates"},
                  json=rows,
                  timeout=20.0,
              )
              print(f"Supabase live feed sync HTTP {r.status_code}: {len(rows)} rows")
          PY

          git config user.name "konklancer-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scanner/cloud-feed.jsonl scanner/cloud-status.json
          git commit -q -m "data(scan): فید و وضعیت اسکن زنده [skip ci]" || echo "چیزی برای کامیت نبود"
          git push || (git pull --rebase --autostash && git push) || echo "PUSH_FAILED_END"

      - name: بارگذاری artifact فید
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed
          path: |
            scanner/out/projects.jsonl
            scanner/out/diagnostics.txt
            scanner/platforms.json
            scanner/cloud-status.json
          if-no-files-found: warn
          retention-days: 14

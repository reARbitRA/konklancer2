name: Build Android APK

on:
  push:
    branches:
      - arena/bb8cb4b4-konklancer
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS address of the personal Konklancer server
        required: true
        type: string
        default: 'https://3000-i2b82mc4n98k6zu2kjmoo.e2b.app'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || 'https://3000-i2b82mc4n98k6zu2kjmoo.e2b.app' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate server URL
        working-directory: mobile
        run: |
          node --input-type=module -e "const url = new URL(process.env.CAPACITOR_SERVER_URL); if (url.protocol !== 'https:') throw new Error('HTTPS is required'); console.log('Android app will open:', url.origin);"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Sync app configuration
        working-directory: mobile
        run: |
          set +e
          npx cap sync android 2>&1 | tee "$RUNNER_TEMP/konklancer-cap-sync.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/konklancer-cap-sync.log" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()[-20:]
          message = ' | '.join(line.strip() for line in lines if line.strip())
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Capacitor sync failed::{message}')
          PY
            exit "$status"
          fi

      - name: Build APK
        working-directory: mobile/android
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/konklancer-gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/konklancer-gradle.log" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()[-25:]
          message = ' | '.join(line.strip() for line in lines if line.strip())
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Gradle build failed::{message}')
          PY
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konklancer-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

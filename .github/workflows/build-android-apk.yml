name: Build Android Debug APK (root project)

# NOTE: The `mobile/` directory referenced in older versions of this workflow
# no longer exists — the current APK build lives in `android/` at the repo
# root and is driven by .github/workflows/android-apk.yml. This workflow builds
# a quick debug APK for fast verification on a tablet.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS address of the personal Konklancer server
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build web bundle + modernize CSS
        run: npm run build

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konklancer-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: build-android-apk

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Clean Non-Obfuscated Release APK (SDK 34)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package KonkLancer-v2.apk
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk release-out/KonkLancer-v2.apk
          ls -lh release-out/KonkLancer-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KonkLancer-v2-apk
          path: release-out/KonkLancer-v2.apk
          retention-days: 30

    <script>
      // Ignore WebSocket and HMR errors per AI Studio environment constraints
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('moduleRunner') || e.filename?.includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = String(e.reason || '');
        if (reason.includes('WebSocket') || reason.includes('moduleRunner') || (e.reason && e.reason.stack && e.reason.stack.includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>

  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300 min-h-screen">

    <script>
      if ('serviceWorker' in navigator && !window.Capacitor) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>

    <script>
      // Safe storage shim for Android Chrome / Samsung Internet local file:// & content:// HTML mode
      (function () {
        function ensureStorage(kind) {
          try {
            var s = window[kind];
            s.setItem('__kl_probe__', '1');
            s.removeItem('__kl_probe__');
            return;
          } catch (e) {}
          var store = {};
          try {
            if (window.name && window.name.indexOf('__KL_STORE__:') === 0) {
              store = JSON.parse(window.name.slice(13)) || {};
            }
          } catch (e) {}
          function persist() {
            try {
              var compact = {};
              Object.keys(store).forEach(function (key) {
                var val = String(store[key] || '');
                if (val.length < 120000) compact[key] = val;
              });
              window.name = '__KL_STORE__:' + JSON.stringify(compact);
            } catch (e) {}
          }
          var mem = {
            getItem: function (key) {
              return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null;
            },
            setItem: function (key, val) {
              store[key] = String(val);
              persist();
            },
            removeItem: function (key) {
              delete store[key];
              persist();
            },
            clear: function () {
              store = {};
              persist();
            },
            key: function (i) {
              return Object.keys(store)[i] || null;
            },
            get length() {
              return Object.keys(store).length;
            },
          };
          try {
            Object.defineProperty(window, kind, { value: mem, configurable: true });
          } catch (e) {}
        }
        ensureStorage('localStorage');
        ensureStorage('sessionStorage');
      })();

      // Ignore WebSocket and HMR errors per AI Studio environment constraints
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('moduleRunner') || e.filename?.includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = String(e.reason || '');
        if (reason.includes('WebSocket') || reason.includes('moduleRunner') || (e.reason && e.reason.stack && e.reason.stack.includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>

    <div id="root"></div>
    <script>
      // --- Polyfills for older WebView / Samsung Internet / local file:// ---
      // Array.prototype.at requires Chrome 92+; Object.hasOwn requires Chrome 93+;
      // structuredClone requires Chrome 98+. Android WebView < 92 will crash otherwise.
      if (window.Array && !Array.prototype.at) {
        Array.prototype.at = function (n) {
          var len = this.length;
          var k = Math.floor(n);
          if (k < 0) k += len;
          if (k < 0 || k >= len) return undefined;
          return this[k];
        };
      }
      if (window.Object && typeof Object.hasOwn !== 'function') {
        Object.hasOwn = function (obj, key) {
          return Object.prototype.hasOwnProperty.call(obj, key);
        };
      }
      if (typeof window.structuredClone !== 'function') {
        window.structuredClone = function (obj) {
          return JSON.parse(JSON.stringify(obj));
        };
      }
      if (window.TextEncoder && !window.TextDecoder) {
        // TextDecoder is used in some Chromium builds on older Android; Node/undici polyfill fallback
        window.TextDecoder = function TextDecoderFallback() {
          this.decode = function (buf) { return String(buf); };
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Use RELATIVE service worker URL so it works on GitHub Pages subpaths,
      // Netlify/Vercel, local file://, and the APK WebView — not only on root origins.
      if ('serviceWorker' in navigator && !window.Capacitor) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>

ext {
    // minSdkVersion 22 (Android 5.1 Lollipop MR1) satisfies AndroidX appcompat
    // 1.7+ while installing on virtually every Galaxy Tab and Android tablet.
    minSdkVersion = 22
    // compileSdk 34 (Android 14) is universally supported on Ubuntu CI runners
    // and compatible with AndroidX 1.13 / Activity 1.9.
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.9.0'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.13.1'
    androidxFragmentVersion = '1.8.0'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.11.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '14.0.1'
}
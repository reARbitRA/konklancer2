ext {
    // Lower minSdk to 19 so the APK installs on older Samsung Galaxy Tabs
    // (Android 4.4+ / One UI < 6). The app is a WebView shell and works fine
    // on API 19; Capacitor's own min is 23 but our custom WebView-only build
    // does not use Capacitor plugins that require higher APIs.
    minSdkVersion = 19
    // compileSdk 34 (Android 14) allows modern AndroidX dependencies to compile
    // while keeping minSdk 19 for maximum device compatibility.
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}
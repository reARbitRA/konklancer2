ext {
    // Lower minSdk to 19 so the APK installs on older Samsung Galaxy Tabs
    // (Android 4.4+ / One UI < 6). The app is a WebView shell and works fine
    // on API 19; Capacitor's own min is 23 but our custom WebView-only build
    // does not use Capacitor plugins that require higher APIs.
    minSdkVersion = 19
    // compileSdk 34 (Android 14) is universally supported on Ubuntu CI runners
    // and compatible with AndroidX 1.13 / Activity 1.9.
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.9.0'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.13.1'
    androidxFragmentVersion = '1.8.0'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.11.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '14.0.1'
}